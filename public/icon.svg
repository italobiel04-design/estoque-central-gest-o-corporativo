<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="#FFFFFF"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#blueGrad)"/>

  <!-- Geometric Warehouse / Cube Architecture -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Top Face of Main Central Cube -->
    <polygon points="256,120 380,185 256,250 132,185" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Left Face of Main Cube -->
    <polygon points="132,185 256,250 256,380 132,315" fill="#1E3A8A"/>
    <!-- Right Face of Main Cube -->
    <polygon points="256,250 380,185 380,315 256,380" fill="#1D4ED8"/>

    <!-- High-priority Critical Red Accent (Floating Top Inventory Indicator / Tag) -->
    <polygon points="256,150 320,185 256,220 192,185" fill="url(#redGrad)"/>

    <!-- Dynamic Barcode / QR Grid Lines inside Cube -->
    <line x1="165" y1="240" x2="225" y2="272" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <line x1="165" y1="265" x2="215" y2="292" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <line x1="165" y1="290" x2="200" y2="309" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

    <!-- High Tech Sensor / Node on Right -->
    <circle cx="318" cy="275" r="8" fill="#FFFFFF"/>
    <line x1="318" y1="283" x2="318" y2="330" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="4,4"/>
  </g>

  <!-- Base Badge / Red Status Pill -->
  <rect x="156" y="405" width="200" height="36" rx="18" fill="url(#redGrad)"/>
  <text x="256" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ESTOQUE CENTRAL</text>
</svg>
